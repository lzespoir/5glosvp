[pytest]
pythonpath = src
testpaths = tests
addopts = --strict-markers
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
markers =
    unit: 不依赖 Sionna/GPU 的软件单元测试 / software unit tests (no Sionna, no GPU)
    integration: 调用真实后端的集成测试 / integration tests against a real backend
    sionna: 需要可运行的 Sionna RT 环境 / requires a working Sionna RT runtime
