schema_version: "0.1"
algorithm:
  id: example_external_optimizer
  name: Example External Optimizer
  version: "0.1.0"
  description: Minimal trusted external SDK example for Day 10 onboarding
  provider: Day 10 example package
  category: external
  learning_algorithm: false
sdk:
  version: "0.1"
entrypoint:
  module: optimizer
  class: ExampleExternalOptimizer
compatibility:
  problem_types:
    - user_association
  parameter_types:
    - categorical_vector
parameters:
  seed:
    type: integer
    default: 20260929
    minimum: 0
    description: Deterministic package-side candidate ordering seed
  candidate_offset:
    type: integer
    default: 1
    minimum: 1
    maximum: 50
    description: Number of initial candidates skipped in the deterministic ordering
resources:
  cpu: true
  gpu: optional
execution:
  supports_cancel: false
implementation_origin: original
